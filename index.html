<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Bolão Copa 2026</title>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0B1120;
      --card: #131B2E;
      --border: #1E2D45;
      --green: #00C851;
      --text: #E0E8F0;
      --muted: #6B7A8D;
      --blue: #1565C0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Screens ── */
    .screen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .screen.active { display: flex; }

    #screen-app { flex-direction: column; }
    #screen-app.active { display: flex; }

    /* ── Auth cards ── */
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }
    .auth-card h1 { font-size: 1.6rem; font-weight: 800; color: var(--green); margin-bottom: 0.3rem; }
    .auth-card .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.75rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.8rem; color: var(--muted);
      margin-bottom: 0.4rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 0.7rem 1rem;
      font-size: 1rem; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--green); }

    .btn-primary {
      width: 100%; background: var(--green); color: #0B1120;
      border: none; border-radius: 8px; padding: 0.8rem 1rem;
      font-size: 1rem; font-weight: 800; cursor: pointer;
      transition: opacity 0.15s; margin-top: 0.5rem;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .error-msg { color: #ff5555; font-size: 0.82rem; margin-top: 0.4rem; min-height: 1.2em; }

    .player-list { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 0.75rem; }
    .player-btn {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 0.65rem 1rem; text-align: left; cursor: pointer;
      font-size: 0.95rem; transition: border-color 0.2s, background 0.2s;
    }
    .player-btn:hover { border-color: var(--green); background: #0d1625; }

    .divider {
      display: flex; align-items: center; gap: 0.6rem;
      margin: 1rem 0; color: var(--muted); font-size: 0.78rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── App header ── */
    .app-header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0.7rem 1rem; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem;
      position: sticky; top: 0; z-index: 100;
    }
    .app-logo { font-size: 0.95rem; font-weight: 800; color: var(--green); white-space: nowrap; }
    .header-right { display: flex; align-items: center; gap: 0.6rem; }
    .player-badge {
      font-size: 0.82rem; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 100px;
    }
    .btn-pdf {
      background: transparent; border: 1px solid var(--green); color: var(--green);
      border-radius: 6px; padding: 0.38rem 0.75rem; font-size: 0.78rem;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .btn-pdf:hover { background: var(--green); color: var(--bg); }

    /* ── Tabs ── */
    .tabs {
      background: var(--card); border-bottom: 1px solid var(--border);
      display: flex; overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); padding: 0.7rem 1.2rem; font-size: 0.88rem;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }

    /* ── Tab content ── */
    .tab-content { flex: 1; overflow-y: auto; }
    .tab-pane { display: none; padding: 1rem; }
    .tab-pane.active { display: block; }

    /* ── Group selector ── */
    .group-selector {
      display: flex; gap: 0.35rem; overflow-x: auto;
      scrollbar-width: none; padding-bottom: 0.5rem; margin-bottom: 1rem;
    }
    .group-selector::-webkit-scrollbar { display: none; }
    .group-btn {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 0.35rem 0.7rem; font-size: 0.82rem;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 0.3rem;
      transition: border-color 0.15s, color 0.15s; flex-shrink: 0;
    }
    .group-btn.active { border-color: var(--green); color: var(--text); }
    .group-btn .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); display: none; flex-shrink: 0;
    }
    .group-btn.complete .dot { display: block; }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.65rem 1rem; margin-bottom: 0.6rem;
      display: flex; align-items: center; gap: 0.9rem;
    }
    .progress-label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
    .progress-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s; }

    .save-indicator {
      font-size: 0.75rem; color: var(--muted); text-align: right;
      min-height: 1.1em; margin-bottom: 0.4rem;
    }
    .save-indicator.saving { color: var(--green); }

    /* ── Match card (group stage) ── */
    .match-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.7rem 0.9rem; margin-bottom: 0.5rem;
    }
    .round-label {
      font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.06em; font-weight: 700; margin-bottom: 0.65rem;
    }
    .match-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.55rem; }
    .match-row:last-child { margin-bottom: 0; }
    .team-name { flex: 1; font-size: 0.82rem; font-weight: 500; line-height: 1.3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .team-name.home { text-align: right; }
    .team-name.away { text-align: left; }

    /* ── Score inputs (shared by group stage and knockout) ── */
    .score-input {
      width: 44px; min-width: 44px; min-height: 44px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); text-align: center; padding: 0.38rem 0;
      font-size: 0.95rem; font-weight: 700; outline: none;
      transition: border-color 0.15s; -moz-appearance: textfield; appearance: textfield;
    }
    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .score-input:focus { border-color: var(--green); }
    .score-input.filled { border-color: #00C85166; }

    .score-sep { color: var(--muted); font-size: 0.8rem; font-weight: 700; }

    /* ── Standings ── */
    .standings-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 1.25rem; overflow: hidden;
    }
    .card-header {
      padding: 0.55rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.75rem; font-weight: 800; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      padding: 0.45rem 0.4rem; text-align: center; color: var(--muted);
      font-weight: 700; font-size: 0.72rem; text-transform: uppercase;
    }
    th:first-child { text-align: left; padding-left: 0.75rem; }
    td { padding: 0.42rem 0.4rem; text-align: center; border-top: 1px solid #1E2D4540; }
    td:first-child { text-align: left; padding-left: 0.75rem; font-weight: 500; }
    tr.q1 td { background: #00C85118; }
    tr.q2 td { background: #00C85109; }
    tr.q3 td { background: #1565C018; }

    .section-title {
      font-size: 0.9rem; font-weight: 800; color: var(--text);
      margin-bottom: 0.65rem; padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Knockout match cards ── */
    .ko-grid { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 0.5rem; }
    .ko-match {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.65rem 0.9rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .ko-id {
      font-size: 0.65rem; color: var(--muted); font-weight: 800;
      min-width: 32px; text-transform: uppercase;
    }
    .ko-teams {
      flex: 1; display: flex; align-items: center; gap: 0.4rem; min-width: 0;
    }
    .ko-team {
      flex: 1; font-size: 0.82rem; font-weight: 500;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ko-team.home { text-align: right; }
    .ko-team.ph { color: var(--muted); font-style: italic; font-size: 0.75rem; }
    .ko-vs { color: var(--muted); font-size: 0.75rem; font-weight: 800; flex-shrink: 0; }

    /* ── Compare ── */
    .compare-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .compare-table { table-layout: fixed; }
    .compare-table th, .compare-table td { min-width: 60px; font-size: 0.78rem; padding: 0.38rem 0.45rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compare-table th:first-child, .compare-table td:first-child { width: 120px; text-align: left; }

    /* ── Group selector min-width ── */
    .group-btn { min-width: 4.2rem; }

    .ko-team-ph { color: var(--muted) !important; font-style: italic; font-size: .75rem !important; }

    /* ── Admin ── */
    .admin-lock-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 2rem; max-width: 420px; margin: 2rem auto;
    }
    .admin-lock-card h2 { font-size: 1.3rem; font-weight: 800; color: var(--green); margin-bottom: 0.3rem; }
    .admin-lock-card .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

    .penalties-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.78rem; color: var(--muted);
      margin: -0.15rem 0 0.45rem; padding: 0 0.9rem 0 calc(0.9rem + 32px + 0.6rem);
    }
    .penalties-row input[type="checkbox"] { accent-color: var(--green); width: 14px; height: 14px; flex-shrink: 0; }

    /* ── Ranking ── */
    .rank-1st td { background: #f5c51820; }
    .rank-2nd td { background: #c0c0c018; }
    .rank-3rd td { background: #cd7f3218; }

    @media (max-width: 399px) {
      .ko-team { font-size: 0.75rem; }
    }

    /* ── Auth wrapper (stacks card + leaderboard) ── */
    .auth-wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0; }

    /* ── Public leaderboard (pre-login) ── */
    .public-lb-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.25rem;
    }
    .public-lb-title {
      font-size: 0.72rem; font-weight: 800; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.65rem;
    }
    .public-lb-table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    .public-lb-table tr { border-top: 1px solid #1E2D4540; }
    .public-lb-table tr:first-child { border-top: none; }
    .public-lb-table td { padding: 0.38rem 0.3rem; vertical-align: middle; }
    .public-lb-table .lb-pos { color: var(--muted); font-weight: 700; width: 2rem; text-align: center; font-size: 0.78rem; }
    .public-lb-table .lb-name { font-weight: 600; }
    .public-lb-table .lb-pts { text-align: right; font-weight: 800; color: var(--green); white-space: nowrap; font-size: 0.82rem; }
    .public-lb-table .lb-medal { font-size: 0.85rem; width: 1.4rem; text-align: center; }

    /* ── Print ── */
    .print-only { display: none; }

    @media print {
      body { background: white !important; color: black !important; font-family: Arial, sans-serif; margin: 0; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      #screen-auth, #screen-name { display: none !important; }
      #screen-app { display: block !important; }
      .app-header, .tabs, .tab-content { display: none !important; }
      .print-only * { color: black !important; background: white !important; }

      .print-header { font-size: 1rem; font-weight: 800; border-bottom: 2px solid black; padding-bottom: 0.3rem; margin-bottom: 0.6rem; }

      .print-section { margin-bottom: 0.8rem; }
      .print-section + .print-section { page-break-before: always; }
      .print-section > h2 { font-size: 0.82rem; font-weight: 700; margin: 0 0 0.35rem; padding-bottom: 0.15rem; border-bottom: 1px solid #555; text-transform: uppercase; letter-spacing: 0.04em; }

      /* Group stage: 3-column grid */
      .print-groups-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3rem 1rem; }

      .print-group { break-inside: avoid; margin-bottom: 0.25rem; }
      .print-group-title { font-weight: 700; font-size: 0.72rem; margin-bottom: 0.1rem; padding-bottom: 0.08rem; border-bottom: 1px solid #bbb; }

      .print-match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; font-size: 0.66rem; line-height: 1.45; }
      .pm-home { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pm-score { text-align: center; font-weight: 600; padding: 0 0.35rem; white-space: nowrap; min-width: 3.5rem; }
      .pm-away { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* KO stage: 2-column grid for the bigger rounds */
      .print-ko-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.3rem 1.2rem; }
      .print-ko-grid .print-group { margin-bottom: 0.2rem; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════ AUTH SCREEN -->
<div id="screen-auth" class="screen active" style="align-items:flex-start;padding-top:2rem">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>⚽ Bolão Copa 2026</h1>
      <p class="subtitle">Digite o token de acesso para entrar</p>
      <div class="form-group">
        <label>Token de acesso</label>
        <input type="password" id="token-input" placeholder="••••••••" autocomplete="off" />
      </div>
      <p class="error-msg" id="token-error"></p>
      <button class="btn-primary" id="token-btn">Entrar</button>
    </div>
    <div id="public-leaderboard" class="public-lb-card" style="display:none">
      <div class="public-lb-title">Classificação ao Vivo</div>
      <table class="public-lb-table">
        <tbody id="public-lb-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════ NAME SCREEN -->
<div id="screen-name" class="screen">
  <div class="auth-card">
    <h1>Quem é você?</h1>
    <p class="subtitle">Selecione ou crie seu perfil de participante</p>
    <div class="player-list" id="player-list"></div>
    <div class="divider">ou novo participante</div>
    <div class="form-group">
      <label>Novo nome</label>
      <input type="text" id="new-name-input" placeholder="Seu nome" maxlength="30" />
    </div>
    <p class="error-msg" id="name-error"></p>
    <button class="btn-primary" id="new-name-btn">Entrar com este nome</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════ APP SCREEN -->
<div id="screen-app" class="screen">

  <header class="app-header no-print">
    <span class="app-logo">⚽ Bolão Copa 2026</span>
    <div class="header-right">
      <span class="player-badge" id="player-badge"></span>
      <button class="btn-pdf" id="pdf-btn">Gerar PDF</button>
    </div>
  </header>

  <nav class="tabs no-print">
    <button class="tab-btn active"  data-tab="fase-grupos">Fase de Grupos</button>
    <button class="tab-btn"         data-tab="classificacao">Classificação</button>
    <button class="tab-btn"         data-tab="matamata">Mata-mata</button>
    <button class="tab-btn"         data-tab="comparar">Comparar</button>
    <button class="tab-btn"         data-tab="ranking">Ranking</button>
    <button class="tab-btn"         data-tab="admin">Admin</button>
  </nav>

  <div class="tab-content no-print">

    <!-- Fase de Grupos -->
    <div class="tab-pane active" id="tab-fase-grupos">
      <div class="progress-wrap">
        <span class="progress-label" id="progress-label">0 / 72 preenchidos</span>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div class="save-indicator" id="save-indicator"></div>
      <div class="group-selector" id="gs-fase-grupos"></div>
      <div id="fase-grupos-body"></div>
    </div>

    <!-- Classificação -->
    <div class="tab-pane" id="tab-classificacao">
      <div id="class-body"></div>
    </div>

    <!-- Mata-mata -->
    <div class="tab-pane" id="tab-matamata">
      <div id="mata-body"></div>
    </div>

    <!-- Comparar -->
    <div class="tab-pane" id="tab-comparar">
      <div class="group-selector" id="gs-comparar"></div>
      <div id="comp-body"></div>
    </div>

    <!-- Ranking -->
    <div class="tab-pane" id="tab-ranking">
      <div id="ranking-body"></div>
    </div>

    <!-- Admin -->
    <div class="tab-pane" id="tab-admin"></div>

  </div>

  <div class="print-only" id="print-content"></div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA — GRUPOS E PARTIDAS
═══════════════════════════════════════════════════════════════════ */

const GROUPS = {
  A: ['México', 'África do Sul', 'Coreia do Sul', 'República Tcheca'],
  B: ['Canadá', 'Bósnia e Herzegovina', 'Catar', 'Suíça'],
  C: ['Brasil', 'Marrocos', 'Haiti', 'Escócia'],
  D: ['Estados Unidos', 'Paraguai', 'Austrália', 'Turquia'],
  E: ['Alemanha', 'Curaçao', 'Costa do Marfim', 'Equador'],
  F: ['Holanda', 'Japão', 'Suécia', 'Tunísia'],
  G: ['Bélgica', 'Egito', 'Irã', 'Nova Zelândia'],
  H: ['Espanha', 'Cabo Verde', 'Arábia Saudita', 'Uruguai'],
  I: ['França', 'Senegal', 'Iraque', 'Noruega'],
  J: ['Argentina', 'Argélia', 'Áustria', 'Jordânia'],
  K: ['Portugal', 'RD Congo', 'Uzbequistão', 'Colômbia'],
  L: ['Inglaterra', 'Croácia', 'Gana', 'Panamá'],
};

const GROUP_KEYS = Object.keys(GROUPS);

const ROUND_PAIRS = [
  [[0,1],[2,3]],
  [[0,2],[1,3]],
  [[0,3],[1,2]],
];

const MATCHES = (() => {
  const list = [];
  let id = 1;
  for (let r = 0; r < 3; r++) {
    for (const g of GROUP_KEYS) {
      const t = GROUPS[g];
      for (const [hi, ai] of ROUND_PAIRS[r]) {
        list.push({ id, group: g, round: r + 1, home: t[hi], away: t[ai] });
        id++;
      }
    }
  }
  return list;
})();

const matchesByGroup = {};
for (const g of GROUP_KEYS) matchesByGroup[g] = MATCHES.filter(m => m.group === g);

/* ─── Mata-mata — 32-avos ─── */

const KNOCKOUT = [
  { id: 'M73', homeSeed: '2A', awaySeed: '2B',  thirdKey: null },
  { id: 'M74', homeSeed: '1E', awaySeed: null,   thirdKey: 'M74' },
  { id: 'M75', homeSeed: '1F', awaySeed: '2C',   thirdKey: null },
  { id: 'M76', homeSeed: '1C', awaySeed: '2F',   thirdKey: null },
  { id: 'M77', homeSeed: '1I', awaySeed: null,   thirdKey: 'M77' },
  { id: 'M78', homeSeed: '2E', awaySeed: '2I',   thirdKey: null },
  { id: 'M79', homeSeed: '1A', awaySeed: null,   thirdKey: 'M79' },
  { id: 'M80', homeSeed: '1L', awaySeed: null,   thirdKey: 'M80' },
  { id: 'M81', homeSeed: '1D', awaySeed: null,   thirdKey: 'M81' },
  { id: 'M82', homeSeed: '1G', awaySeed: null,   thirdKey: 'M82' },

const ref = path => db.ref(path);
async function fbGet(path)        { return (await ref(path).once('value')).val(); }

function fbOnValue(path, cb)      { ref(path).on('value', snap => cb(snap.val())); }

/* ═══════════════════════════════════════════════════════════════════
   CLASSIFICAÇÃO
═══════════════════════════════════════════════════════════════════ */

function hasPred(p) {
  return p != null && p.h !== '' && p.h != null && p.a !== '' && p.a != null
    && !isNaN(parseInt(p.h)) && !isNaN(parseInt(p.a));
}

function calcGroupStandings(gKey, preds) {
  const teams = GROUPS[gKey].map(name => ({ name, J:0, V:0, E:0, D:0, GF:0, GA:0, SG:0, PTS:0 }));
  for (const match of matchesByGroup[gKey]) {
    const pred = preds[match.id];
    if (!hasPred(pred)) continue;
    const h = parseInt(pred.h), a = parseInt(pred.a);
    const hT = teams.find(t => t.name === match.home);
    const aT = teams.find(t => t.name === match.away);
    hT.J++; aT.J++;
    hT.GF += h; hT.GA += a;
    aT.GF += a; aT.GA += h;
    if      (h > a) { hT.V++; hT.PTS += 3; aT.D++; }
    else if (h < a) { aT.V++; aT.PTS += 3; hT.D++; }
    else            { hT.E++; aT.E++; hT.PTS++; aT.PTS++; }
  }
  teams.forEach(t => t.SG = t.GF - t.GA);
  teams.sort((a, b) => b.PTS - a.PTS || b.SG - a.SG || b.GF - a.GF);
  return teams;
}

function calcAllStandings(preds) {
  const r = {};
  for (const g of GROUP_KEYS) r[g] = calcGroupStandings(g, preds);
  return r;
}

function rankThirds(allSt) {
  return GROUP_KEYS
    .map(g => ({ group: g, ...allSt[g][2] }))
    .sort((a, b) => b.PTS - a.PTS || b.SG - a.SG || b.GF - a.GF);
}

function solveThirds(allSt) {
  const key = rankThirds(allSt).slice(0, 8).map(t => t.group).sort().join('');
  return FIFA_THIRDS[key] || {};
}

function resolveDirectSeed(seed, allSt) {
  const m = seed.match(/^([12])([A-L])$/);
  if (!m) return null;
  const pos = parseInt(m[1]) - 1, grp = m[2];
  const st = allSt[grp];
  if (!st || !st[pos] || st[pos].J === 0) return null;
  return st[pos].name;
}

/* ═══════════════════════════════════════════════════════════════════
   KNOCKOUT TEAM RESOLUTION
═══════════════════════════════════════════════════════════════════ */

// Build a flat map of matchId → { home, away } for ALL knockout matches.
// M73–M88 come from group stage; M89–M104 cascade from koScores.
function buildAllKoTeams(allSt, thAssign, thirds, scores) {
  const teams = {};

  // M73–M88
  for (const ko of KNOCKOUT) {
    const home = resolveDirectSeed(ko.homeSeed, allSt);
    let away;
    if (ko.awaySeed) {
      away = resolveDirectSeed(ko.awaySeed, allSt);
    } else {
      const ag = thAssign[ko.thirdKey];
      if (ag) {
        const t3 = thirds.find(t => t.group === ag);
        away = (t3 && t3.J > 0) ? t3.name : null;
      } else {
        away = null;
      }
    }
    teams[ko.id] = { home, away };
  }

  // M89–M104 (in dependency order as defined in BRACKET_ROUNDS)
  for (const round of BRACKET_ROUNDS.slice(1)) {
    for (const mid of round.ids) {
      const feed = BRACKET[mid];
      teams[mid] = {
        home: resolveRef(feed.home, teams, scores),
        away: resolveRef(feed.away, teams, scores),
      };
    }
  }

  return teams;
}

function resolveRef(refStr, teams, scores) {
  const col = refStr.indexOf(':');
  const type  = refStr.slice(0, col);
  const srcId = refStr.slice(col + 1);
  const t = teams[srcId];
  if (!t || (!t.home && !t.away)) return null;
  const sc = (scores !== undefined ? scores : koScores)[srcId];
  if (!hasPred(sc)) return null;
  const h = parseInt(sc.h), a = parseInt(sc.a);
  if (h === a) return null; // draw → no winner in knockout
  const winner = h > a ? t.home : t.away;
  const loser  = h > a ? t.away : t.home;
  return type === 'w' ? winner : loser;
}

// Human-readable placeholder when a team is not yet resolved
function koPlaceholderText(mid, side, thAssign) {
  const ko = KNOCKOUT.find(k => k.id === mid);
  if (ko) {
    if (side === 'home') return ko.homeSeed;
    if (ko.awaySeed)     return ko.awaySeed;
    const ag = thAssign[ko.thirdKey];
    if (ag) return `3º Gr.${ag}`;
    return `3º(${THIRD_CONSTRAINTS[ko.thirdKey].join('')})`;
  }
  const feed = BRACKET[mid];
  if (!feed) return '?';
  const ref = side === 'home' ? feed.home : feed.away;
  const col = ref.indexOf(':');
  const type = ref.slice(0, col), srcId = ref.slice(col + 1);
  return type === 'w' ? `Venc. ${srcId}` : `Perd. ${srcId}`;
}

function isGroupComplete(gKey) {
  return matchesByGroup[gKey].every(m => hasPred(predictions[m.id]));

  return MATCHES.filter(m => hasPred(predictions[m.id])).length;
}

function updateProgress() {
  const n = countFilled();
  document.getElementById('progress-label').textContent = `${n} / 72 preenchidos`;
  document.getElementById('progress-fill').style.width = `${(n / 72) * 100}%`;
}

function renderGroupSelector(containerId, activeGroup, onClick) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  for (const g of GROUP_KEYS) {
    const btn = document.createElement('button');
    btn.className = 'group-btn' +
      (g === activeGroup ? ' active' : '') +
      (isGroupComplete(g) ? ' complete' : '');
    btn.innerHTML = `Grupo ${g}<span class="dot"></span>`;
    btn.addEventListener('click', () => onClick(g));
    el.appendChild(btn);
  }
}

function sgStr(n) { return n > 0 ? `+${n}` : `${n}`; }

      const hv = (pred.h !== undefined && pred.h !== null && pred.h !== '') ? pred.h : '';
      const av = (pred.a !== undefined && pred.a !== null && pred.a !== '') ? pred.a : '';
      html += `
        <div class="match-row">

          <span class="team-name away">${match.away}</span>
        </div>`;
    }
    card.innerHTML = html;
    card.querySelectorAll('.score-input').forEach(inp =>
      inp.addEventListener('input', onGroupScoreInput)
    );
    body.appendChild(card);
  }

function onGroupScoreInput(e) {
  const mid  = parseInt(e.target.dataset.mid);
  const side = e.target.dataset.side;
  const raw  = e.target.value;

  if (!predictions[mid]) predictions[mid] = { h: '', a: '' };

  if (raw === '') {
    predictions[mid][side] = '';
    e.target.classList.remove('filled');
  } else {
    const v = Math.min(20, Math.max(0, parseInt(raw) || 0));
    e.target.value = v;
    predictions[mid][side] = v;
    e.target.classList.add('filled');
  }

  updateProgress();
  renderGroupSelector('gs-fase-grupos', groupFaseGrupos, g => {
    groupFaseGrupos = g;
    renderFaseDeGrupos();
  });
  scheduleSave();
}

// Update only the team-name spans in the bracket without rebuilding the inputs
function updateKoTeamSpans() {
  const allSt    = calcAllStandings(predictions);
  const thAssign = solveThirds(allSt);
  const thirds   = rankThirds(allSt);
  const koTeams  = buildAllKoTeams(allSt, thAssign, thirds);

  document.querySelectorAll('[data-ko-team]').forEach(span => {
    const mid  = span.dataset.koTeam;
    const side = span.dataset.koSide;
    const team = koTeams[mid] && koTeams[mid][side];
    if (team) {
      span.textContent = team;
      span.classList.remove('ph');
    } else {
      span.textContent = koPlaceholderText(mid, side, thAssign);
      span.classList.add('ph');
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════════ */

function calcPlayerScore(playerGroupPreds, playerKoPreds) {
  let groupPts = 0;
  for (const m of MATCHES) {
    const pred = playerGroupPreds[m.id];
    const real = groupResults[m.id];
    if (!hasPred(pred) || !hasPred(real)) continue;
    const ph = parseInt(pred.h), pa = parseInt(pred.a);
    const rh = parseInt(real.h), ra = parseInt(real.a);
    if (ph === rh && pa === ra) groupPts += 15;
    else if (Math.sign(ph - pa) === Math.sign(rh - ra)) groupPts += 5;
  }

  let koPts = 0;
  const ko = playerKoPreds || {};

  const realAllSt    = calcAllStandings(groupResults);
  const realThAssign = solveThirds(realAllSt);
  const realThirds   = rankThirds(realAllSt);
  const realBracket  = buildAllKoTeams(realAllSt, realThAssign, realThirds, koResults);

  const pAllSt    = calcAllStandings(playerGroupPreds);
  const pThAssign = solveThirds(pAllSt);
  const pThirds   = rankThirds(pAllSt);
  const pBracket  = buildAllKoTeams(pAllSt, pThAssign, pThirds, ko);

  const koStages = [
    { ids: ['M89','M90','M91','M92','M93','M94','M95','M96'], pts: 20 },
    { ids: ['M97','M98','M99','M100'],                        pts: 30 },
    { ids: ['M101','M102'],                                   pts: 50 },
    { ids: ['M104'],                                          pts: 75 },
  ];
  for (const stage of koStages) {
    const realT = new Set(), predT = new Set();
    for (const mid of stage.ids) {
      const rt = realBracket[mid], pt = pBracket[mid];
      if (rt) { if (rt.home) realT.add(rt.home); if (rt.away) realT.add(rt.away); }
      if (pt) { if (pt.home) predT.add(pt.home); if (pt.away) predT.add(pt.away); }
    }
    for (const t of realT) if (predT.has(t)) koPts += stage.pts;
  }

  // Champion bonus
  const rf = realBracket['M104'], rs = koResults['M104'];
  if (rf && hasPred(rs)) {
    const rh = parseInt(rs.h), ra = parseInt(rs.a);
    const realChamp = rh > ra ? rf.home : ra > rh ? rf.away : null;
    if (realChamp) {
      const pf = pBracket['M104'], ps = ko['M104'];
      if (pf && hasPred(ps)) {
        const ph = parseInt(ps.h), pa = parseInt(ps.a);
        const predChamp = ph > pa ? pf.home : pa > ph ? pf.away : null;
        if (predChamp === realChamp) koPts += 200;
      }
    }
  }

  // 3rd place
  const r3 = realBracket['M103'], p3 = pBracket['M103'];
  if (r3 && p3) {
    const rT3 = [r3.home, r3.away].filter(Boolean);
    const pT3 = new Set([p3.home, p3.away].filter(Boolean));
    for (const t of rT3) if (pT3.has(t)) koPts += 50;
  }

  return { groupPts, koPts, total: groupPts + koPts };
}

function renderPublicLeaderboard() {
  const card = document.getElementById('public-leaderboard');
  const body = document.getElementById('public-lb-body');
  if (!card || !body) return;

  if (!publicLbPlayers.length) { card.style.display = 'none'; return; }

  const scores = publicLbPlayers.map(p => ({
    name: p,
    total: calcPlayerScore(allPredictions[p] || {}, allKoPredictions[p] || {}).total,
  })).sort((a, b) => b.total - a.total);

  const medals = ['🥇', '🥈', '🥉'];
  let pos = 1;
  let html = '';
  scores.forEach((s, i) => {
    if (i > 0 && s.total < scores[i - 1].total) pos = i + 1;
    const medal = pos <= 3 ? `<td class="lb-medal">${medals[pos - 1]}</td>` : `<td class="lb-medal"></td>`;
    html += `<tr>
      <td class="lb-pos">${pos}</td>
      ${medal}
      <td class="lb-name">${s.name}</td>
      <td class="lb-pts">${s.total} pts</td>
    </tr>`;
  });

  body.innerHTML = html;
  card.style.display = '';
}

        <thead><tr><th style="text-align:left">Fase</th><th>Pts/time</th></tr></thead>

async function handleAdminLogin() {
  const inp = document.getElementById('admin-pw-input');
  const err = document.getElementById('admin-pw-error');
  const pw  = inp ? inp.value.trim() : '';
  if (!pw) { if (err) err.textContent = 'Digite a senha.'; return; }
  try {
    const stored = await fbGet('/bolao/adminPassword');
    if (stored === null) {
      await fbSet('/bolao/adminPassword', pw);
      adminUnlocked = true;
      renderAdmin();
    } else if (stored === pw) {
      adminUnlocked = true;
      renderAdmin();
    } else {
      if (err) err.textContent = 'Senha incorreta.';
    }
  } catch (e) {
    if (err) err.textContent = 'Erro de conexão.';
    console.error(e);
  }
}

function renderAdmin() {
  const body = document.getElementById('tab-admin');
  if (!body) return;

  if (!adminUnlocked) {
    body.innerHTML = `
      <div class="admin-lock-card">
        <h2>Acesso Admin</h2>
        <p class="subtitle">Digite a senha de administrador para inserir os resultados reais.</p>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="admin-pw-input" placeholder="••••••••" autocomplete="off" />
        </div>
        <p class="error-msg" id="admin-pw-error"></p>
        <button class="btn-primary" id="admin-pw-btn">Entrar</button>
      </div>`;
    document.getElementById('admin-pw-btn').addEventListener('click', handleAdminLogin);
    document.getElementById('admin-pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleAdminLogin(); });
    return;
  }

  let html = '';
  html += `<div class="section-title">Resultados — Fase de Grupos</div>`;
  html += `<div class="save-indicator" id="admin-save-ind"></div>`;
  html += `<div class="group-selector" id="gs-admin"></div>`;
  html += `<div id="admin-group-body"></div>`;
  html += `<div class="section-title" style="margin-top:1.5rem">Resultados — Mata-mata</div>`;

  for (const round of BRACKET_ROUNDS) {
    html += `<p style="font-size:.78rem;color:var(--muted);font-weight:700;margin:.75rem 0 .4rem">${round.label}</p>`;
    html += `<div class="ko-grid">`;
    for (const mid of round.ids) {
      const r  = koResults[mid] || {};
      const hv = (r.h !== undefined && r.h !== null && r.h !== '') ? r.h : '';
      const av = (r.a !== undefined && r.a !== null && r.a !== '') ? r.a : '';
      const pens = r.penalties || false;
      html += `
        <div>
          <div class="ko-match">
            <span class="ko-id">${mid}</span>
            <div class="ko-teams">
              <span class="ko-team home ko-team-ph" id="ak-h-${mid}">...</span>
              <input class="score-input${hv !== '' ? ' filled' : ''}" type="number" min="0" max="30" inputmode="numeric"
                     value="${hv}" data-mid="${mid}" data-side="h" data-ko-admin="1">
              <span class="ko-vs">×</span>
              <input class="score-input${av !== '' ? ' filled' : ''}" type="number" min="0" max="30" inputmode="numeric"
                     value="${av}" data-mid="${mid}" data-side="a" data-ko-admin="1">
              <span class="ko-team ko-team-ph" id="ak-a-${mid}">...</span>
            </div>
          </div>
          <div class="penalties-row">
            <input type="checkbox" data-mid="${mid}" data-pens="1" ${pens ? 'checked' : ''}> Pênaltis
          </div>
        </div>`;
    }
    html += `</div>`;
  }

  body.innerHTML = html;

  renderGroupSelector('gs-admin', adminGroup, g => { adminGroup = g; renderAdminGroupBody(); });
  renderAdminGroupBody();
  updateAdminKoTeams();

  body.querySelectorAll('.score-input[data-ko-admin]').forEach(inp =>
    inp.addEventListener('input', onAdminKoInput)
  );
  body.querySelectorAll('input[data-pens]').forEach(cb =>
    cb.addEventListener('change', onAdminPenaltiesChange)
  );
}

function renderAdminGroupBody() {
  const body = document.getElementById('admin-group-body');
  if (!body) return;
  body.innerHTML = '';
  for (let r = 1; r <= 3; r++) {
    const roundMatches = matchesByGroup[adminGroup].filter(m => m.round === r);
    const card = document.createElement('div');
    card.className = 'match-card';
    let html = `<div class="round-label">Rodada ${r}</div>`;
    for (const match of roundMatches) {
      const res = groupResults[match.id] || {};
      const hv = (res.h !== undefined && res.h !== null && res.h !== '') ? res.h : '';
      const av = (res.a !== undefined && res.a !== null && res.a !== '') ? res.a : '';
      html += `
        <div class="match-row">
          <span class="team-name home">${match.home}</span>
          <input class="score-input${hv !== '' ? ' filled' : ''}" type="number" min="0" max="20" inputmode="numeric"
                 value="${hv}" data-mid="${match.id}" data-side="h" data-ag="1">
          <span class="score-sep">×</span>
          <input class="score-input${av !== '' ? ' filled' : ''}" type="number" min="0" max="20" inputmode="numeric"
                 value="${av}" data-mid="${match.id}" data-side="a" data-ag="1">
          <span class="team-name away">${match.away}</span>
        </div>`;
    }
    card.innerHTML = html;
    card.querySelectorAll('.score-input[data-ag]').forEach(inp =>
      inp.addEventListener('input', onAdminGroupInput)
    );
    body.appendChild(card);
  }
}

function onAdminGroupInput(e) {
  const mid  = parseInt(e.target.dataset.mid);
  const side = e.target.dataset.side;
  const raw  = e.target.value;
  if (!groupResults[mid]) groupResults[mid] = {};
  if (raw === '') {
    groupResults[mid][side] = '';
    e.target.classList.remove('filled');
  } else {
    const v = Math.min(20, Math.max(0, parseInt(raw) || 0));
    e.target.value = v;
    groupResults[mid][side] = v;
    e.target.classList.add('filled');
  }
  scheduleAdminGroupSave();
}

function scheduleAdminGroupSave() {
  const ind = document.getElementById('admin-save-ind');
  if (ind) { ind.textContent = 'Salvando…'; ind.className = 'save-indicator saving'; }
  clearTimeout(adminGroupSaveTimer);
  adminGroupSaveTimer = setTimeout(async () => {
    try {
      await fbSet('/bolao/results/group', groupResults);
      if (ind) { ind.textContent = 'Salvo ✓'; ind.className = 'save-indicator'; }
      updateAdminKoTeams();
      if (currentTab === 'ranking') renderRanking();
    } catch (_) {
      if (ind) { ind.textContent = 'Erro ao salvar'; ind.className = 'save-indicator'; }
    }
  }, 800);
}

function updateAdminKoTeams() {
  const allSt    = calcAllStandings(groupResults);
  const thAssign = solveThirds(allSt);
  const thirds   = rankThirds(allSt);
  const koTeams  = buildAllKoTeams(allSt, thAssign, thirds, koResults);
  for (const [mid, t] of Object.entries(koTeams)) {
    const hEl = document.getElementById(`ak-h-${mid}`);
    const aEl = document.getElementById(`ak-a-${mid}`);
    if (hEl) hEl.textContent = t.home || koPlaceholderText(mid, 'home', thAssign);
    if (aEl) aEl.textContent = t.away || koPlaceholderText(mid, 'away', thAssign);
  }
}

function onAdminKoInput(e) {
  const mid  = e.target.dataset.mid;
  const side = e.target.dataset.side;
  const raw  = e.target.value;
  if (!koResults[mid]) koResults[mid] = {};
  if (raw === '') {
    koResults[mid][side] = '';
    e.target.classList.remove('filled');
  } else {
    const v = Math.min(30, Math.max(0, parseInt(raw) || 0));
    e.target.value = v;
    koResults[mid][side] = v;
    e.target.classList.add('filled');
  }
  updateAdminKoTeams();
  scheduleAdminKoSave();
}

function onAdminPenaltiesChange(e) {
  const mid = e.target.dataset.mid;
  if (!koResults[mid]) koResults[mid] = {};
  koResults[mid].penalties = e.target.checked;
  scheduleAdminKoSave();
}

function scheduleAdminKoSave() {
  const ind = document.getElementById('admin-save-ind');
  if (ind) { ind.textContent = 'Salvando…'; ind.className = 'save-indicator saving'; }
  clearTimeout(adminKoSaveTimer);
  adminKoSaveTimer = setTimeout(async () => {
    try {
      await fbSet('/bolao/results/knockout', koResults);
      if (ind) { ind.textContent = 'Salvo ✓'; ind.className = 'save-indicator'; }
      if (currentTab === 'ranking') renderRanking();
    } catch (_) {
      if (ind) { ind.textContent = 'Erro ao salvar'; ind.className = 'save-indicator'; }
    }
  }, 800);
}

/* ═══════════════════════════════════════════════════════════════════
   PDF
═══════════════════════════════════════════════════════════════════ */

function generatePDF() {
  const allSt    = calcAllStandings(predictions);
  const thAssign = solveThirds(allSt);
  const thirds   = rankThirds(allSt);
  const koTeams  = buildAllKoTeams(allSt, thAssign, thirds);
  const now      = new Date();
  const dateStr  = now.toLocaleDateString('pt-BR') + ' ' +
                   now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  const matchRow = (home, score, away) =>
    `<div class="print-match">
       <span class="pm-home">${home}</span>
       <span class="pm-score">${score}</span>
       <span class="pm-away">${away}</span>
     </div>`;

  let html = `<div class="print-header">Bolão Copa 2026 — ${currentPlayer} — ${dateStr}</div>`;

  // Fase de grupos — 3 colunas
  html += `<div class="print-section"><h2>Fase de Grupos</h2><div class="print-groups-grid">`;
  for (const g of GROUP_KEYS) {
    html += `<div class="print-group"><div class="print-group-title">Grupo ${g}</div>`;
    for (const m of matchesByGroup[g]) {
      const p = predictions[m.id];
      html += matchRow(m.home, hasPred(p) ? `${p.h} × ${p.a}` : '– × –', m.away);
    }
    html += `</div>`;
  }
  html += `</div></div>`;

  // Mata-mata — 32-avos e 16-avos em 2 colunas, demais fases em coluna única
  html += `<div class="print-section"><h2>Mata-mata</h2>`;
  const koWide      = ['32-avos de Final', '16-avos de Final'];
  const laterRounds = BRACKET_ROUNDS.filter(r => !koWide.includes(r.label));

  for (const round of BRACKET_ROUNDS.filter(r => koWide.includes(r.label))) {
    html += `<div class="print-group-title" style="grid-column:1/-1;margin-top:0.3rem">${round.label}</div>`;
    html += `<div class="print-ko-grid">`;
    for (const mid of round.ids) {
      const t    = koTeams[mid] || {};
      const sc   = koScores[mid];
      const home = t.home || koPlaceholderText(mid, 'home', thAssign);
      const away = t.away || koPlaceholderText(mid, 'away', thAssign);
      html += `<div class="print-group">` +
              matchRow(home, hasPred(sc) ? `${sc.h} × ${sc.a}` : '– × –', away) +
              `</div>`;
    }
    html += `</div>`;
  }

  for (const round of laterRounds) {
    html += `<div class="print-group" style="margin-top:0.4rem">
               <div class="print-group-title">${round.label}</div>`;
    for (const mid of round.ids) {
      const t    = koTeams[mid] || {};
      const sc   = koScores[mid];
      const home = t.home || koPlaceholderText(mid, 'home', thAssign);
      const away = t.away || koPlaceholderText(mid, 'away', thAssign);
      html += matchRow(home, hasPred(sc) ? `${sc.h} × ${sc.a}` : '– × –', away);
    }
    html += `</div>`;
  }
  html += `</div>`;

  document.getElementById('print-content').innerHTML = html;
  window.print();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.tab === tab)
  );
  document.querySelectorAll('.tab-pane').forEach(pane =>

  );

/* ═══════════════════════════════════════════════════════════════════
   AUTH FLOW
═══════════════════════════════════════════════════════════════════ */

async function handleTokenSubmit() {
  const inp = document.getElementById('token-input');
  const err = document.getElementById('token-error');
  const btn = document.getElementById('token-btn');
  const tok = inp.value.trim();
  if (!tok) { err.textContent = 'Digite o token de acesso.'; return; }

  btn.disabled = true; btn.textContent = 'Verificando…'; err.textContent = '';
  try {
    const stored = await fbGet('/bolao/token');
    if (stored === null) {
      await fbSet('/bolao/token', tok);
      await showNameScreen();
    } else if (stored === tok) {
      await showNameScreen();
    } else {
      err.textContent = 'Token inválido. Tente novamente.';
    }
  } catch (e) {
    err.textContent = 'Erro de conexão. Verifique o Firebase.';
    console.error(e);
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}

async function showNameScreen() {
  const players = (await fbGet('/bolao/players')) || [];
  const list = document.getElementById('player-list');
  list.innerHTML = '';
  if (!players.length) {
    list.innerHTML = '<p style="color:var(--muted);font-size:.85rem">Seja o primeiro participante!</p>';
  } else {
    players.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'player-btn';
      btn.textContent = name;
      btn.addEventListener('click', () => enterAsPlayer(name));
      list.appendChild(btn);
    });
  }
  document.getElementById('screen-auth').classList.remove('active');
  document.getElementById('screen-name').classList.add('active');
}

async function handleNewName() {
  const inp  = document.getElementById('new-name-input');
  const err  = document.getElementById('name-error');
  const btn  = document.getElementById('new-name-btn');
  const name = inp.value.trim();
  if (!name || name.length < 2) { err.textContent = 'Nome inválido (mínimo 2 caracteres).'; return; }

  btn.disabled = true; err.textContent = '';
  try {
    const players = (await fbGet('/bolao/players')) || [];
    if (!players.includes(name)) { players.push(name); await fbSet('/bolao/players', players); }
    await enterAsPlayer(name);
  } catch (e) {
    err.textContent = 'Erro ao registrar. Tente novamente.';
    console.error(e);
    btn.disabled = false;
  }
}

async function enterAsPlayer(name) {
  currentPlayer = name;
  const [predData, koData] = await Promise.all([
    fbGet(`/bolao/predictions/${name}`),
    fbGet(`/bolao/knockout/${name}`),
  ]);
  predictions = predData || {};
  koScores    = koData   || {};

  document.getElementById('player-badge').textContent = name;
  document.getElementById('screen-name').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');

  renderFaseDeGrupos();
}

function subscribeAll() {
  fbOnValue('/bolao/players', data => {
    publicLbPlayers = data || [];
    renderPublicLeaderboard();
  });
  fbOnValue('/bolao/predictions', data => {
    allPredictions = data || {};
    renderPublicLeaderboard();
    if (currentTab === 'comparar') renderComparar();
    if (currentTab === 'ranking')  renderRanking();
  });
  fbOnValue('/bolao/knockout', data => {
    allKoPredictions = data || {};
    renderPublicLeaderboard();
    if (currentTab === 'ranking') renderRanking();
  });
  fbOnValue('/bolao/results/group', data => {
    groupResults = data || {};
    renderPublicLeaderboard();
    if (currentTab === 'ranking') renderRanking();
    if (currentTab === 'admin' && adminUnlocked) { renderAdminGroupBody(); updateAdminKoTeams(); }
  });
  fbOnValue('/bolao/results/knockout', data => {
    koResults = data || {};
    renderPublicLeaderboard();
    if (currentTab === 'ranking') renderRanking();
    if (currentTab === 'admin' && adminUnlocked) updateAdminKoTeams();
  });
}

/* ═══════════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════════ */

document.addEventListener('DOMContentLoaded', () => {
  if (!initFirebase()) {
    document.getElementById('screen-auth').innerHTML = `
      <div class="auth-card">
        <h1>Erro de Configuração</h1>
        <p class="subtitle">O arquivo <code>firebase-config.js</code> não foi encontrado ou está incorreto.</p>
        <p style="font-size:.85rem;color:var(--muted);margin-top:1rem">
          Copie <code>firebase-config.example.js</code> para <code>firebase-config.js</code>
          e preencha com as suas credenciais do Firebase Realtime Database.
        </p>
      </div>`;
    return;
  }

  subscribeAll();

  document.getElementById('token-btn').addEventListener('click', handleTokenSubmit);
  document.getElementById('token-input').addEventListener('keydown', e => e.key === 'Enter' && handleTokenSubmit());
  document.getElementById('new-name-btn').addEventListener('click', handleNewName);
  document.getElementById('new-name-input').addEventListener('keydown', e => e.key === 'Enter' && handleNewName());
  document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.addEventListener('click', () => switchTab(btn.dataset.tab))
  );
  document.getElementById('pdf-btn').addEventListener('click', generatePDF);
});
</script>
</body>
</html>
